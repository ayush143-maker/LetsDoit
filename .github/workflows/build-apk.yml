name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Fonts are fetched at build time (IBM Plex, SIL OFL). The build now FAILS if a
      # download breaks, so the app can never silently ship with the system font again.
      - name: Download fonts (IBM Plex Sans + Mono)
        run: |
          mkdir -p app/src/main/assets/fonts
          sans="https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans/fonts/complete/ttf"
          mono="https://raw.githubusercontent.com/IBM/plex/master/packages/plex-mono/fonts/complete/ttf"
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL --retry 3 "$sans/IBMPlexSans-$w.ttf" -o "app/src/main/assets/fonts/IBMPlexSans-$w.ttf"
          done
          for w in Regular Medium; do
            curl -fsSL --retry 3 "$mono/IBMPlexMono-$w.ttf" -o "app/src/main/assets/fonts/IBMPlexMono-$w.ttf"
          done
          ls -la app/src/main/assets/fonts
          for f in app/src/main/assets/fonts/*.ttf; do
            test "$(wc -c < "$f")" -gt 20000 || { echo "::error::$f looks broken"; exit 1; }
          done

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LetsDoIt-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LetsDoIt-apk
          path: LetsDoIt-release.apk
          if-no-files-found: error
